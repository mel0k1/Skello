name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build linux --release
        if: matrix.os == 'ubuntu-latest'
      - run: flutter build windows --release
        if: matrix.os == 'windows-latest'
      - name: Package (linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar -czf ../skello-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz -C build/linux/x64/release bundle -C ${{ github.workspace }} udev
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path build/windows/x64/runner/Release/*, ${{ github.workspace }}/windows -DestinationPath ../skello-${{ github.ref_name }}-${{ matrix.artifact }}.zip
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skello-*
