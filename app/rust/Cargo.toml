[package]
name = "rust_lib_skello"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
skello-chipsets = { path = "../../crates/skello-chipsets" }
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
skello-adb = { path = "../../crates/skello-adb" }
skello-bootimg = { path = "../../crates/skello-bootimg" }
skello-fastboot = { path = "../../crates/skello-fastboot" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
