name: skello
description: Skello desktop app, flashing and rooting toolkit for Android devices.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  intl: any
  material_ui: ^1.11.1
  path_provider: ^2.1.5
  rust_lib_skello:
    path: rust_builder

dev_dependencies:
  file_selector_platform_interface: ^2.6.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/logo.png
  generate: true
  uses-material-design: true
